<!DOCTYPE html>
<html lang="en">
<head>

<title>Lexia</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1c1a;--mute:#9a9890;--ok:#2f9e6b;--bad:#e0523f;--bar:#1c1c1a;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f1efe8;--mute:#6f6d66;--ok:#5fcf9a;--bad:#ff7b66;--bar:#f1efe8}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f1efe8;--mute:#6f6d66;--ok:#5fcf9a;--bad:#ff7b66;--bar:#f1efe8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;overflow:hidden}
#bar{height:4px;background:var(--bar);width:100%;transform-origin:left;transform:scaleX(0)}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:18px 24px;font-size:13px;letter-spacing:.2em;color:var(--mute)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;text-align:center}
#title{font-size:clamp(28px,7vw,56px);letter-spacing:.35em;margin-right:-.35em}
#sub{margin-top:20px;font-size:13px;letter-spacing:.25em;color:var(--mute);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#play{display:none;width:100%;flex-direction:column;align-items:center}
#ans{width:100%;max-width:900px;background:none;border:0;outline:0;color:var(--fg);text-align:center;text-transform:uppercase;font:inherit;font-size:clamp(28px,7vw,60px);letter-spacing:.18em;padding:0;caret-color:var(--fg)}
#ans.ok{color:var(--ok)}#ans.bad{color:var(--bad)}#diff{display:none;min-height:1.2em;font-size:clamp(26px,6.5vw,68px);white-space:nowrap;overflow:hidden;letter-spacing:.18em;text-transform:uppercase;text-align:center;line-height:1.2}#diff .ok{color:var(--ok)}#diff .miss,#diff .bad{color:var(--bad)}#diff .dl{white-space:nowrap}#diff .gap{color:var(--mute)}#diff .sm{font-size:50%}
#fb{height:1.4em;margin-top:18px;font-size:clamp(18px,3.6vw,28px);letter-spacing:.18em;color:var(--ok)}
.pop{animation:pop .25s}@keyframes pop{from{transform:scale(1.15)}to{transform:scale(1)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#rep{display:inline-flex;align-items:center;gap:10px;margin-top:0;background:none;border:1.5px solid var(--mute);color:var(--fg);border-radius:999px;padding:10px 22px;font:inherit;font-size:13px;letter-spacing:.2em;cursor:pointer;transition:transform .1s,border-color .1s}#rep:hover{border-color:var(--fg)}#rep:active{transform:scale(.94)}
#btns{display:flex;justify-content:flex-end;align-items:center;width:100%;max-width:900px;margin:26px auto 0}
#arow{display:contents}#arow #ans{flex:none;width:100%;max-width:900px;min-width:0}#rep{order:5;margin-top:28px}body.touch #rep{order:-1;margin:0;width:44px;height:44px;padding:0;justify-content:center;border-radius:50%}body.touch #rep .rt{display:none}body.touch #rep svg{width:18px;height:18px}body.touch #btns{display:flex;justify-content:space-between;align-items:center;gap:24px}
#act{display:none;align-items:center;gap:10px;background:none;border:1.5px solid var(--mute);color:var(--fg);border-radius:999px;padding:10px 22px;font:inherit;font-size:13px;letter-spacing:.2em;cursor:pointer;transition:transform .1s,border-color .1s}body.touch #act{display:inline-flex}#act:hover{border-color:var(--fg)}#act:active{transform:scale(.94)}
@media (orientation:portrait){body.touch #btns{position:fixed;left:0;right:0;bottom:var(--kb,0px);margin:0;max-width:none;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bg);z-index:4}body.touch #play{padding-bottom:96px}}
@media (orientation:portrait){body.touch.kbon #btns{position:static;bottom:auto;margin:24px auto 0;padding:0;background:none}body.touch.kbon #play{padding-bottom:0}}
#ctrl{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;flex-basis:100%;order:3;margin-top:10px}#th{margin-top:10px;min-height:1.5em;font-size:clamp(14px,2.8vw,18px);color:var(--mute);letter-spacing:.04em}.chip{background:none;border:1.5px solid var(--mute);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:11px;letter-spacing:.2em;cursor:pointer}.chip:hover{border-color:var(--fg)}
#gear,#rgear{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:0;width:28px;height:28px;border-radius:50%}#setp{display:none;position:fixed;inset:0;background:var(--bg);z-index:7;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 24px}#sbox{max-width:560px;margin:0 auto}.srow{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--mute);font-size:16px;letter-spacing:.15em}
#panel{display:none;position:fixed;inset:0;background:var(--bg);z-index:8;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px 24px;overflow-y:auto}#pbox{max-width:560px;margin:0 auto}#phead{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.2em;color:var(--mute);margin-bottom:18px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--mute);font-size:18px;letter-spacing:.15em}.row small{font-size:12px;color:var(--mute);letter-spacing:.1em}.row.ok{color:var(--ok)}.row.bad{color:var(--bad)}#pempty{color:var(--mute);font-size:13px;letter-spacing:.15em;padding:30px 0;text-align:center}
#rd{display:none;position:fixed;inset:0;z-index:6;background:var(--bg);flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:manipulation}
#rbar button,#rfoot button{position:relative;z-index:1}
#rbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;row-gap:14px}#rctl{display:flex;gap:8px;flex-wrap:wrap}
#rstat{min-height:2em;margin:0;flex:1 1 auto;order:-1;text-align:left;font-size:13px;letter-spacing:.2em;color:var(--mute)}
#rtext{flex:1;overflow:hidden;max-width:760px;width:100%;margin:0 auto;font-size:clamp(22px,4.4vw,34px);line-height:1.8;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
#rtext.done{overflow-y:auto}.sp{height:42vh}
.w{display:inline-block;margin:0 .2em;transition:color .25s}.w.ok{color:var(--ok)}.w.close{color:#e0a100}.w.miss{color:var(--bad)}
#rfoot{text-align:center;padding-top:10px}
footer{padding:18px;text-align:center;font-size:11px;letter-spacing:.2em;color:var(--mute)}
</style>
</head>

function tone(f,d,type="sine",v=.06,t0=0,f2){
  if(muted||!ac)return;
  const t=ac.currentTime+t0,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}

function diffHTML(a,b){
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out='';const sp=(c,k)=>'<span class="'+k+'">'+c+'</span>';
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){out+=sp(b[j],'ok');i++;j++}
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){out+=sp(b[j],'miss');j++}
    else{out+=sp(a[i],'bad');i++}
  }
  return out;
}
function diffRows(a,b){
  const n=a.length,m=b.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,top='',bot='';const sp=(c,k)=>'<span class="'+k+'">'+c+'</span>';
  while(i<n||j<m){
    if(i<n&&j<m&&a[i]===b[j]){top+=sp(a[i],'ok');bot+=sp(b[j],'ok');i++;j++}
    else if(j<m&&(i>=n||L[i][j+1]>=L[i+1][j])){top+=sp('·','gap');bot+=sp(b[j],'miss');j++}
    else{top+=sp(a[i],'bad');bot+=sp('·','gap');i++}
  }
  return [top,bot];
}
function diffRows2(a,b){

}

  if(state!=="ask")return;
  state="reveal";cancelAnimationFrame(raf);$("act").textContent="NEXT →";if(TOUCH)ans.blur();
  const got=ans.value.trim().toUpperCase(),ok=got===word.toUpperCase();
  total++;if(!TOUCH)ans.readOnly=true;
  const h=hist[word]||(hist[word]={r:0,w:0});ok?h.r++:h.w++;h.last=ok?1:0;h.t=Date.now();doneRound.add(word);save();updMode();
  if(ok){score++;streak++;ans.className="ok";fb.textContent="";sOk();ans.classList.add("pop")}
  else{streak=0;ans.className="bad";fb.style.color="var(--ok)";fb.textContent=word.toUpperCase();if(!got)ans.value="···";sBad();fb.classList.remove("shake");void fb.offsetWidth;fb.classList.add("shake")}
  if(ok){fb.style.color="var(--ok)";fb.textContent="✓"}
  const dd=$("diff");const r=diffRows2(got,word.toUpperCase());dd.innerHTML='<div class="dl">'+r[0]+'</div><div class="dl sm">'+r[1]+'</div>';
  $("score").textContent=score+" / "+total;$("th").textContent=TH[word]||"";
  $("streak").textContent=streak>1?"STREAK "+streak:"";
}
function unlock(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();if(!window._keep){window._keep=1;const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const s=ac.createBufferSource();s.buffer=b;s.loop=true;s.connect(ac.destination);s.start()}}catch(e){}
  try{speechSynthesis.getVoices();speechSynthesis.resume()}catch(e){}
}
function start(){
  if(state!=="idle")return;
  unlock();
  $("idle").style.display="none";$("play").style.display="flex";
  speechSynthesis.getVoices();window._kb=true;next();window._kb=false;
}
document.addEventListener("keydown",e=>{
  if(reading)return;if(panel){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closePanel()}return}
  if(state==="idle"){if(e.key==="Enter"){e.preventDefault();start()}return}
  if(e.key==="Enter"){e.preventDefault();if(TOUCH&&state==="ask"&&!ans.value.trim())return;sEnter();state==="ask"?reveal():next();return}
  if(e.key==="Tab"){e.preventDefault();speak();return}
  if(state==="ask"&&(e.key==="m"||e.key==="M")&&e.ctrlKey){muted=!muted;e.preventDefault()}
  if(state==="reveal")e.preventDefault();
});
ans.addEventListener("input",()=>{
  const old=ans._len||0;
  ans.value=ans.value.toUpperCase().replace(/[^A-Z' -]/g,"");
  ans._len=ans.value.length;
  ans.value.length>=old?sTick():sBack();
});
$("rep").addEventListener("click",e=>{e.stopPropagation();unlock();tone(520,.06,"triangle",.05);speak();ans.focus()});
$("act").addEventListener("click",e=>{e.stopPropagation();unlock();if(state==="ask"){sEnter();reveal()}else if(state==="reveal"){window._kb=true;ans.readOnly=false;ans.focus();next();window._kb=false}});
function updMode(){const w=sn().filter(k=>!hist[k].last).length;$("mode").textContent=mode==="review"?(w?"REVIEW · "+w+" WRONG":"REVIEW · ALL RIGHT"):"ALL WORDS";$("lv").textContent=LVNAME[level]}
function closePanel(){panel=false;$("panel").style.display="none";if(state!=="idle")ans.focus()}
function openPanel(){
  panel=true;
  const ks=seen().sort((a,b)=>(hist[a].last-hist[b].last)||((hist[b].t||0)-(hist[a].t||0)));
  const right=ks.filter(k=>hist[k].last).length;
  $("ptitle").textContent="HISTORY · "+right+" / "+ks.length+" CORRECT";
  $("plist").innerHTML=ks.length?ks.map(k=>"<div class='row "+(hist[k].last?"ok":"bad")+"'><span>"+k.toUpperCase()+"</span><small>PLAYED "+(hist[k].r+hist[k].w)+" · WRONG "+hist[k].w+"</small></div>").join(""):"<div id='pempty'>NO WORDS YET</div>";
  $("panel").style.display="block";
}
$("mode").addEventListener("click",e=>{e.stopPropagation();mode=mode==="all"?"review":"all";deck=[];doneRound.clear();save();updMode();if(state!=="idle")ans.focus()});
$("hbtn").addEventListener("click",e=>{e.stopPropagation();$("setp").style.display="none";openPanel()});
$("spd").addEventListener("click",e=>{e.stopPropagation();unlock();ri2=(ri2+1)%RATES.length;try{localStorage.setItem("spell_rate",ri2)}catch(x){}$("spd").textContent=spdLabel();speak()});
$("spd").textContent=spdLabel();
$("gear").addEventListener("click",e=>{e.stopPropagation();ans.blur();syncMode();$("setp").style.display="block"});
$("sclose").addEventListener("click",e=>{e.stopPropagation();$("setp").style.display="none";if(TOUCH)ans.blur();else if(state!=="idle")ans.focus()});
$("pclose").addEventListener("click",e=>{e.stopPropagation();closePanel();$("setp").style.display="block"});
$("lv").addEventListener("click",e=>{e.stopPropagation();const o=["all","1","2","3","4","5","6","7","rand"];level=o[(o.indexOf(level)+1)%9];deck=[];doneRound.clear();save();updMode();if(state!=="idle")ans.focus()});
updMode();
document.addEventListener("click",()=>{if(panel||reading)return;state==="idle"?start():ans.focus()});
ans.addEventListener("blur",()=>{if(!TOUCH&&state==="ask"&&!reading)setTimeout(()=>ans.focus(),0)});

/* READ MODE */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TEXTS=[[1,'My Morning','Every morning I wake up at six. I wash my face and brush my teeth. Then I eat bread and drink a glass of milk. My mother makes lunch for me. I walk to school with my best friend. We talk about games and music on the way. I like my school because my teachers are kind. After class I go home and play with my dog.'],[1,'The Market','On Sunday my family goes to the market. There are many fruits and vegetables to see. My father buys red apples and yellow bananas. My sister likes the sweet orange juice. A man sells small toys near the gate. I find a blue pencil box and ask my mother to buy it. We carry the bags home and cook a big dinner together.'],[2,'A Rainy Day','Rainy season in Thailand starts in May and lasts until October. The sky turns dark in the afternoon and heavy rain falls for about an hour. Streets can flood quickly, so many people carry an umbrella or wait inside a cafe. Motorbike taxis become hard to find, and traffic moves slowly. Still, the rain cools the air, and the city feels fresh and quiet when the storm finally passes.'],[2,'Why We Sleep','Sleep is not a waste of time. While we rest, the brain sorts the memories of the day and removes harmful waste. Students who sleep well usually remember more and make fewer mistakes. Experts suggest that teenagers and young adults need around eight hours every night. Bright screens before bed can make it harder to fall asleep, so it is wise to put your phone away early.'],[3,'The Environment','Scientists have gathered convincing evidence that the global temperature is rising. Governments around the world are under pressure to reduce emissions and encourage sustainable development. Critics argue that these measures are expensive, whereas supporters believe that the long term benefits will outweigh the immediate cost. Whatever the outcome, individual responsibility and collaboration between nations remain essential for protecting the environment.'],[3,'Language and Memory','Learning a foreign language demands patience, discipline, and a considerable amount of repetition. Researchers have discovered that spaced practice strengthens memory far more effectively than cramming the night before an examination. Pronunciation, in particular, improves when learners listen carefully, imitate native speakers, and receive immediate feedback about their mistakes.']];
const RLV=['','BEGINNER','INTERMEDIATE','ADVANCED'],SPD=[.5,.75,1,1.5,2];
const STOP=new Set('a an the of to in on at is it and or i be as'.split(' '));
let rl=1,ri=0,rs=2,words=[],st=[],tmp={},fpos=0,running=false,rec=null,rafR=0,lastR=0,sy=0,endT=0;
const rt=()=>TEXTS.filter(t=>t[0]===rl);
const norm=s=>s.toLowerCase().replace(/[^a-z']/g,'');
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function judge(r,p,out){
  if(!r)return p;
  let k=-1,c='ok';
  for(let i=p;i<Math.min(p+6,words.length);i++)if(words[i]===r){k=i;break}
  if(k<0)for(let i=p;i<Math.min(p+3,words.length);i++){const m=Math.max(r.length,words[i].length);if(m>2&&1-lev(r,words[i])/m>=.6){k=i;c='close';break}}
  if(k<0)return p;
  for(let i=p;i<k;i++)if(!out[i])out[i]=STOP.has(words[i])?'sw':'miss';
  out[k]=c;return k+1;
}
function paint(){for(let i=0;i<words.length;i++){const c=tmp[i]||st[i]||'';const el=$('w'+i);if(el.dataset.c!==c){el.dataset.c=c;el.className='w '+c}}}
function loadText(){
  stopRead(true);
  const l=rt();ri=ri%l.length;const t=l[ri];
  const raw=t[2].split(/\s+/);words=raw.map(norm);st=raw.map(()=>'');tmp={};fpos=0;
  const el=$('rtext');el.className='';
  el.innerHTML="<div class='sp'></div>"+raw.map((w,i)=>"<span class='w' id='w"+i+"'>"+w+'</span>').join(' ')+"<div class='sp'></div>";
  el.scrollTop=0;sy=0;
  $('rlv').textContent=RLV[rl];$('rtx').textContent=t[1].toUpperCase();$('rsp').textContent='SPEED '+SPD[rs]+'x';
  $('rstat').textContent=RLV[rl]+' · '+words.length+' WORDS';$('rgo').textContent='START READING';
}
function tick(t){
  if(!running)return;
  const el=$('rtext');sy+=28*SPD[rs]*(t-lastR)/1000;lastR=t;el.scrollTop=sy;
  if(sy>=el.scrollHeight-el.clientHeight-2){stopRead(false);return}
  rafR=requestAnimationFrame(tick);
}
function startRec(){
  const r=rec=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;let np=0;
  r.onstart=()=>{if(!rafR){lastR=performance.now();rafR=requestAnimationFrame(tick)}};
  r.onresult=e=>{
    if(!running)return;
    const fin=[],itm=[];
    for(let i=0;i<e.results.length;i++){const w=e.results[i][0].transcript.trim().split(/\s+/).map(norm).filter(Boolean);(e.results[i].isFinal?fin:itm).push(...w)}
    for(;np<fin.length;np++)fpos=judge(fin[np],fpos,st);
    tmp={};let p=fpos;itm.forEach(w=>{p=judge(w,p,tmp)});
    paint();
    if(!endT&&Math.max(fpos,p)>=words.length)endT=setTimeout(()=>stopRead(false),1800);
  };
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;halt();$('rgo').textContent='START READING';$('rstat').textContent=(['not-allowed','service-not-allowed'].includes(e.error)?'MIC BLOCKED · OPEN THIS PAGE DIRECTLY IN SAFARI AND ALLOW MIC':'SPEECH ERROR · '+e.error.toUpperCase())};
  r.onend=()=>{if(running&&rec===r){try{startRec()}catch(x){}}};
  r.start();
}
function halt(){running=false;cancelAnimationFrame(rafR);rafR=0;clearTimeout(endT);endT=0;if(rec){rec.onend=null;try{rec.stop()}catch(x){}rec=null}try{if(ac)ac.resume()}catch(e){}}
function stopRead(silent){
  const was=running;halt();$('rgo').textContent='START READING';
  if(!was||silent)return;
  for(const i in tmp)if(!st[i])st[i]=tmp[i];
  tmp={};st=st.map((c,i)=>c||(STOP.has(words[i])?'sw':'miss'));paint();
  const n={ok:0,close:0,miss:0,sw:0};st.forEach(c=>n[c]++);
  const den=words.length-n.sw,acc=den?Math.round((n.ok+n.close*.5)/den*100):0;
  $('rstat').innerHTML=RLV[rl]+" &nbsp;·&nbsp; ACCURACY <b style='font-size:30px;color:var(--fg)'>"+acc+'%</b> &nbsp;·&nbsp; '+n.ok+' CORRECT · '+n.close+' OFF · '+n.miss+' MISSED';
  $('rtext').className='done';
}
function startRead(){
  if(!SR){$('rstat').textContent='NO SPEECH RECOGNITION IN THIS BROWSER · USE CHROME OR EDGE';return}
  try{if(ac&&ac.state==="running")ac.suspend()}catch(e){}
  loadText();running=true;$('rgo').textContent='STOP';$('rstat').textContent='LISTENING · READ ALOUD';
  try{startRec()}catch(x){halt();$('rgo').textContent='START READING'}
  setTimeout(()=>{if(running&&!rafR)$('rstat').textContent='WAITING FOR MIC · NO PROMPT? OPEN THIS PAGE DIRECTLY IN SAFARI'},3000);
}
const toggleRead=()=>running?stopRead(false):startRead();
function syncMode(){$('mlabel').textContent=reading?'SPELLING MODE':'READ MODE';$('rdb').textContent=reading?'SWITCH':'OPEN';$('rowRead').style.display='';$('rowHist').style.display=reading?'none':'';$('rowSpd').style.display=reading?'none':''}
function closeRead(){stopRead(true);reading=false;$('rd').style.display='none';if(state!=='idle')ans.focus()}
$('rdb').addEventListener('click',e=>{e.stopPropagation();$('setp').style.display='none';if(reading){closeRead();return}if('speechSynthesis' in window)speechSynthesis.cancel();reading=true;$('rd').style.display='flex';loadText()});
$('rbar').insertBefore($('rstat'),$('rbar').firstChild);$('rgear').addEventListener('click',e=>{e.stopPropagation();ans.blur();syncMode();$('setp').style.display='block'});
$('rx').addEventListener('click',closeRead);
function bindTap(el,fn){
  let fired=false;
  el.addEventListener('touchend',e=>{fired=true;e.preventDefault();fn(e)},{passive:false});
  el.addEventListener('click',e=>{if(fired){fired=false;return}fn(e)});
}
bindTap($('rgo'),e=>{e.stopPropagation();toggleRead()});
bindTap($('rlv'),e=>{e.stopPropagation();rl=rl%3+1;ri=0;loadText()});
bindTap($('rtx'),e=>{e.stopPropagation();ri++;loadText()});
bindTap($('rsp'),e=>{e.stopPropagation();rs=(rs+1)%SPD.length;$('rsp').textContent='SPEED '+SPD[rs]+'x'});
document.addEventListener('keydown',e=>{if(!reading)return;if(e.key==='Enter'){e.preventDefault();toggleRead()}else if(e.key==='Escape')closeRead()});
</script>
