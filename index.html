<style>

*{box-sizing:border-box}

omy:การแบ่งเป็นสองขั้ว,ebullient:ร่าเริงล้นเหลือ,ephemeral:ชั่วคราวสั้นนัก,facetious:ชอบพูดเล่น,fastidious:จู้จี้พิถีพิถัน,incessant:ไม่หยุดหย่อน,insidious:แอบแฝงอันตราย,meticulous:พิถีพิถัน,nonchalant:เฉยเมย,ostracize:กีดกันออกจากกลุ่ม,pejorative:เชิงดูหมิ่น,quandary:ภาวะลำบากใจ,serendipity:การค้นพบโดยบังเอิญ,sycophant:คนประจบสอพลอ,tenacious:เหนียวแน่นไม่ยอมแพ้"],[7,"chiaroscuro:การเล่นแสงเงา,cacophony:เสียงอึกทึก,catharsis:การระบายอารมณ์,diaphanous:โปร่งแสงบางเบา,fuchsia:สีชมพูบานเย็น,hemorrhage:การตกเลือด,idiosyncratic:เฉพาะตัวแปลกๆ,juxtaposition:การวางเทียบเคียง,kaleidoscope:กล้องกระจกสีเปลี่ยนลาย,labyrinth:เขาวงกต,memorabilia:ของที่ระลึก,phlegmatic:เฉื่อยชา,pharmaceutical:เกี่ยวกับเภสัช,prestidigitation:การเล่นกล,sacrilegious:หมิ่นศาสนา,schism:การแตกแยก,sphygmomanometer:เครื่องวัดความดัน,subpoena:หมายศาล,xenophobia:ความกลัวคนต่างชาติ,zephyr:ลมอ่อนๆ"]]

const sn=()=>seen().filter(inLv);
const doneRound=new Set(),rnd=a=>a[Math.floor(Math.random()*a.length)];
function pickWord(){
  if(mode==="review"&&sn().length){
    let c=sn().filter(k=>!hist[k].last);
    if(!c.length){c=sn().filter(k=>!doneRound.has(k));if(!c.length){doneRound.clear();c=sn()}}

function tone(f,d,type="sine",v=.06,t0=0,f2){
  if(muted||!ac)return;

  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02);
}

const sBack=()=>tone(380,.06,"triangle",.16);
const sEnter=()=>tone(220,.09,"triangle",.25);
const sOk=()=>{tone(660,.14,"sine",.09);tone(880,.14,"sine",.09,.1);tone(1320,.25,"sine",.09,.2)};
const sBad=()=>{tone(220,.35,"sawtooth",.06,0,110);tone(165,.35,"sawtooth",.05,.12,80)};

function speak(){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);u.lang="en-US";u.rate=.85;
  const v=speechSynthesis.getVoices().find(x=>/^en[-_]US/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));
  if(v)u.voice=v;speechSynthesis.speak(u);
}
function draw(){
  const now=performance.now();if(panel||reading)deadline+=now-lastT;lastT=now;
  const left=deadline-now;
  bar.style.transform="scaleX("+Math.max(0,left/TIME)+")";
  if(left<=0){reveal();return}
  raf=requestAnimationFrame(draw);
}
function next(){
  word=pickWord();state="ask";
  ans.value="";ans.className="";ans.readOnly=false;fb.textContent="";$("th").textContent="";
  deadline=performance.now()+TIME;lastT=performance.now();cancelAnimationFrame(raf);draw();
  speak();ans.focus();
}
function reveal(){
  if(state!=="ask")return;
  state="reveal";cancelAnimationFrame(raf);
  const got=ans.value.trim().toUpperCase(),ok=got===word.toUpperCase();
  total++;ans.readOnly=true;
  const h=hist[word]||(hist[word]={r:0,w:0});ok?h.r++:h.w++;h.last=ok?1:0;h.t=Date.now();doneRound.add(word);save();updMode();
  if(ok){score++;streak++;ans.className="ok";fb.textContent="";sOk();ans.classList.add("pop")}
  else{streak=0;ans.className="bad";fb.style.color="var(--ok)";fb.textContent=word.toUpperCase();if(!got)ans.value="···";sBad();fb.classList.remove("shake");void fb.offsetWidth;fb.classList.add("shake")}
  if(ok){fb.style.color="var(--ok)";fb.textContent="✓"}
  $("score").textContent=score+" / "+total;$("th").textContent=TH[word]||"";
  $("streak").textContent=streak>1?"STREAK "+streak:"";
}
function start(){
  if(state!=="idle")return;
  ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  $("idle").style.display="none";$("play").style.display="block";
  speechSynthesis.getVoices();next();
}
document.addEventListener("keydown",e=>{
  if(reading)return;if(panel){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closePanel()}return}
  if(state==="idle"){if(e.key==="Enter"){e.preventDefault();start()}return}
  if(e.key==="Enter"){e.preventDefault();sEnter();state==="ask"?reveal():next();return}
  if(e.key==="Tab"){e.preventDefault();speak();return}
  if(state==="ask"&&(e.key==="m"||e.key==="M")&&e.ctrlKey){muted=!muted;e.preventDefault()}
  if(state==="reveal")e.preventDefault();
});
ans.addEventListener("input",()=>{
  const old=ans._len||0;
  ans.value=ans.value.toUpperCase().replace(/[^A-Z' -]/g,"");
  ans._len=ans.value.length;
  ans.value.length>=old?sTick():sBack();
});
$("rep").addEventListener("click",e=>{e.stopPropagation();tone(520,.06,"triangle",.05);speak();ans.focus()});
function updMode(){const w=sn().filter(k=>!hist[k].last).length;$("mode").textContent=mode==="review"?(w?"REVIEW · "+w+" WRONG":"REVIEW · ALL RIGHT"):"ALL WORDS";$("lv").textContent=LVNAME[level]}
function closePanel(){panel=false;$("panel").style.display="none";if(state!=="idle")ans.focus()}
function openPanel(){
  panel=true;
  const ks=seen().sort((a,b)=>(hist[a].last-hist[b].last)||((hist[b].t||0)-(hist[a].t||0)));
  const right=ks.filter(k=>hist[k].last).length;
  $("ptitle").textContent="HISTORY · "+right+" / "+ks.length+" CORRECT";
  $("plist").innerHTML=ks.length?ks.map(k=>"<div class='row "+(hist[k].last?"ok":"bad")+"'><span>"+k.toUpperCase()+"</span><small>PLAYED "+(hist[k].r+hist[k].w)+" · WRONG "+hist[k].w+"</small></div>").join(""):"<div id='pempty'>NO WORDS YET</div>";
  $("panel").style.display="block";
}
$("mode").addEventListener("click",e=>{e.stopPropagation();mode=mode==="all"?"review":"all";deck=[];doneRound.clear();save();updMode();if(state!=="idle")ans.focus()});
$("hbtn").addEventListener("click",e=>{e.stopPropagation();openPanel()});
$("pclose").addEventListener("click",e=>{e.stopPropagation();closePanel()});
$("lv").addEventListener("click",e=>{e.stopPropagation();const o=["all","1","2","3","4","5","6","7","rand"];level=o[(o.indexOf(level)+1)%9];deck=[];doneRound.clear();save();updMode();if(state!=="idle")ans.focus()});
updMode();
document.addEventListener("click",()=>{if(panel||reading)return;state==="idle"?start():ans.focus()});
ans.addEventListener("blur",()=>{if(state!=="idle"&&!reading)setTimeout(()=>ans.focus(),0)});

/* READ MODE */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const TEXTS=[[1,'My Morning','Every morning I wake up at six. I wash my face and brush my teeth. Then I eat bread and drink a glass of milk. My mother makes lunch for me. I walk to school with my best friend. We talk about games and music on the way. I like my school because my teachers are kind. After class I go home and play with my dog.'],[1,'The Market','On Sunday my family goes to the market. There are many fruits and vegetables to see. My father buys red apples and yellow bananas. My sister likes the sweet orange juice. A man sells small toys near the gate. I find a blue pencil box and ask my mother to buy it. We carry the bags home and cook a big dinner together.'],[2,'A Rainy Day','Rainy season in Thailand starts in May and lasts until October. The sky turns dark in the afternoon and heavy rain falls for about an hour. Streets can flood quickly, so many people carry an umbrella or wait inside a cafe. Motorbike taxis become hard to find, and traffic moves slowly. Still, the rain cools the air, and the city feels fresh and quiet when the storm finally passes.'],[2,'Why We Sleep','Sleep is not a waste of time. While we rest, the brain sorts the memories of the day and removes harmful waste. Students who sleep well usually remember more and make fewer mistakes. Experts suggest that teenagers and young adults need around eight hours every night. Bright screens before bed can make it harder to fall asleep, so it is wise to put your phone away early.'],[3,'The Environment','Scientists have gathered convincing evidence that the global temperature is rising. Governments around the world are under pressure to reduce emissions and encourage sustainable development. Critics argue that these measures are expensive, whereas supporters believe that the long term benefits will outweigh the immediate cost. Whatever the outcome, individual responsibility and collaboration between nations remain essential for protecting the environment.'],[3,'Language and Memory','Learning a foreign language demands patience, discipline, and a considerable amount of repetition. Researchers have discovered that spaced practice strengthens memory far more effectively than cramming the night before an examination. Pronunciation, in particular, improves when learners listen carefully, imitate native speakers, and receive immediate feedback about their mistakes.']];
const RLV=['','BEGINNER','INTERMEDIATE','ADVANCED'],SPD=[.5,.75,1,1.5,2];
const STOP=new Set('a an the of to in on at is it and or i be as'.split(' '));
let rl=1,ri=0,rs=2,words=[],st=[],tmp={},fpos=0,running=false,rec=null,rafR=0,lastR=0,sy=0,endT=0;
const rt=()=>TEXTS.filter(t=>t[0]===rl);
const norm=s=>s.toLowerCase().replace(/[^a-z']/g,'');
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function judge(r,p,out){
  if(!r)return p;
  let k=-1,c='ok';
  for(let i=p;i<Math.min(p+6,words.length);i++)if(words[i]===r){k=i;break}
  if(k<0)for(let i=p;i<Math.min(p+3,words.length);i++){const m=Math.max(r.length,words[i].length);if(m>2&&1-lev(r,words[i])/m>=.6){k=i;c='close';break}}
  if(k<0)return p;
  for(let i=p;i<k;i++)if(!out[i])out[i]=STOP.has(words[i])?'sw':'miss';
  out[k]=c;return k+1;
}
function paint(){for(let i=0;i<words.length;i++){const c=tmp[i]||st[i]||'';const el=$('w'+i);if(el.dataset.c!==c){el.dataset.c=c;el.className='w '+c}}}
function loadText(){
  stopRead(true);
  const l=rt();ri=ri%l.length;const t=l[ri];
  const raw=t[2].split(/\s+/);words=raw.map(norm);st=raw.map(()=>'');tmp={};fpos=0;
  const el=$('rtext');el.className='';
  el.innerHTML="<div class='sp'></div>"+raw.map((w,i)=>"<span class='w' id='w"+i+"'>"+w+'</span>').join(' ')+"<div class='sp'></div>";
  el.scrollTop=0;sy=0;
  $('rlv').textContent=RLV[rl];$('rtx').textContent=t[1].toUpperCase();$('rsp').textContent='SPEED '+SPD[rs]+'x';
  $('rstat').textContent=RLV[rl]+' · '+words.length+' WORDS';$('rgo').textContent='START READING';
}
function tick(t){
  if(!running)return;
  const el=$('rtext');sy+=28*SPD[rs]*(t-lastR)/1000;lastR=t;el.scrollTop=sy;
  if(sy>=el.scrollHeight-el.clientHeight-2){stopRead(false);return}
  rafR=requestAnimationFrame(tick);
}
function startRec(){
  const r=rec=new SR();r.lang='en-US';r.continuous=true;r.interimResults=true;let np=0;
  r.onstart=()=>{if(!rafR){lastR=performance.now();rafR=requestAnimationFrame(tick)}};
  r.onresult=e=>{
    if(!running)return;
    const fin=[],itm=[];
    for(let i=0;i<e.results.length;i++){const w=e.results[i][0].transcript.trim().split(/\s+/).map(norm).filter(Boolean);(e.results[i].isFinal?fin:itm).push(...w)}
    for(;np<fin.length;np++)fpos=judge(fin[np],fpos,st);
    tmp={};let p=fpos;itm.forEach(w=>{p=judge(w,p,tmp)});
    paint();
    if(!endT&&Math.max(fpos,p)>=words.length)endT=setTimeout(()=>stopRead(false),1800);
  };
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;halt();$('rgo').textContent='START READING';$('rstat').textContent=(['not-allowed','service-not-allowed'].includes(e.error)?'MIC BLOCKED · OPEN THIS PAGE DIRECTLY IN SAFARI AND ALLOW MIC':'SPEECH ERROR · '+e.error.toUpperCase())};
  r.onend=()=>{if(running&&rec===r){try{startRec()}catch(x){}}};
  r.start();
}
function halt(){running=false;cancelAnimationFrame(rafR);rafR=0;clearTimeout(endT);endT=0;if(rec){rec.onend=null;try{rec.stop()}catch(x){}rec=null}}
function stopRead(silent){
  const was=running;halt();$('rgo').textContent='START READING';
  if(!was||silent)return;
  for(const i in tmp)if(!st[i])st[i]=tmp[i];
  tmp={};st=st.map((c,i)=>c||(STOP.has(words[i])?'sw':'miss'));paint();
  const n={ok:0,close:0,miss:0,sw:0};st.forEach(c=>n[c]++);
  const den=words.length-n.sw,acc=den?Math.round((n.ok+n.close*.5)/den*100):0;
  $('rstat').innerHTML=RLV[rl]+" &nbsp;·&nbsp; ACCURACY <b style='font-size:30px;color:var(--fg)'>"+acc+'%</b> &nbsp;·&nbsp; '+n.ok+' CORRECT · '+n.close+' OFF · '+n.miss+' MISSED';
  $('rtext').className='done';
}
function startRead(){
  if(!SR){$('rstat').textContent='NO SPEECH RECOGNITION IN THIS BROWSER · USE CHROME OR EDGE';return}
  loadText();running=true;$('rgo').textContent='STOP';$('rstat').textContent='LISTENING · READ ALOUD';
  try{startRec()}catch(x){halt();$('rgo').textContent='START READING'}
  setTimeout(()=>{if(running&&!rafR)$('rstat').textContent='WAITING FOR MIC · NO PROMPT? OPEN THIS PAGE DIRECTLY IN SAFARI'},3000);
}
const toggleRead=()=>running?stopRead(false):startRead();
function closeRead(){stopRead(true);reading=false;$('rd').style.display='none';if(state!=='idle')ans.focus()}
$('rdb').addEventListener('click',e=>{e.stopPropagation();if('speechSynthesis' in window)speechSynthesis.cancel();reading=true;$('rd').style.display='flex';loadText()});
$('rx').addEventListener('click',closeRead);
$('rgo').addEventListener('click',toggleRead);
$('rlv').addEventListener('click',()=>{rl=rl%3+1;ri=0;loadText()});
$('rtx').addEventListener('click',()=>{ri++;loadText()});
$('rsp').addEventListener('click',()=>{rs=(rs+1)%SPD.length;$('rsp').textContent='SPEED '+SPD[rs]+'x'});
document.addEventListener('keydown',e=>{if(!reading)return;if(e.key==='Enter'){e.preventDefault();toggleRead()}else if(e.key==='Escape')closeRead()});
</script>
</body>
</html>
